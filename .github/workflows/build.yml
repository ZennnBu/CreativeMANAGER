
name: Build WOWManager

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Plugin
        run: mvn clean package

      - name: Verify JAR
        run: |
          test -f target/WOWManager-1.0.0.jar
          jar tf target/WOWManager-1.0.0.jar | grep 'WOWManager.class'
          jar tf target/WOWManager-1.0.0.jar | grep 'plugin.yml'

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: WOWManager-JAR
          path: target/WOWManager-1.0.0.jar
          
